name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EasyShop.slnx

      - name: Build
        run: dotnet build EasyShop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EasyShop.slnx --configuration Release --no-build --verbosity normal

  deploy:
    needs: build-and-test
    # Runs only after the repository variable DEPLOY_ENABLED is set to "true" (see docs/DEPLOYMENT.md),
    # so the build and tests stay green on forks and before the secrets exist.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: production-deploy
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the web app
        run: dotnet publish src/EasyShop.API/EasyShop.API.csproj --configuration Release --output ./publish

      # IIS locks the DLLs while the site runs. app_offline.htm stops the app so the files can be replaced.
      - name: Take the site offline
        run: |
          echo '<html><body><h2>EasyShop is being updated. Please try again in a minute.</h2></body></html>' > app_offline.htm
          curl --fail --silent --show-error --ssl-reqd --insecure --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T app_offline.htm "ftp://$FTP_SERVER/wwwroot/"

      # Only the changed files are uploaded. Nothing is deleted on the server that this workflow did not
      # put there, so pictures uploaded by admins and appsettings.Production.json are left alone.
      - name: Upload the new version
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./publish/
          server-dir: /wwwroot/
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Production.json
            **/wwwroot/uploads/**

      - name: Bring the site back online
        if: always()
        run: |
          curl --silent --show-error --ssl-reqd --insecure --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -Q "-DELE wwwroot/app_offline.htm" -o /dev/null "ftp://$FTP_SERVER/"
